<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <title>My ToDo</title>
  </head>
  <body>
    <section class="todo">
      <h1 class="title">TO-DO LIST</h1>
      <div class="input">
        <input type="text" placeholder="add new task" class="input-field" id="todoInput"/> 
        <button class="btn">Add</button>
      </div>
      
      <ul class="scroll" id="todoList"></ul>

      <div>
        <hr class="counter"/>
        <div class="counter-container">
          <p><span id="todoCount">0</span> items total</p>
          <button id="deleteButton">Delete All</button>
        </div>
      </div>
    </section> 
    <footer>
      <p class="design">Designed By;</p>
      <p class="author">Brian Yiga</p>
    </footer>

    <script src="./index.js"></script> <!-- Moved the script here -->
  </body>
</html>
